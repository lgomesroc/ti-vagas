services:
  - type: web
    name: ti-vagas
    runtime: docker
    plan: free
    branch: developer
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        sync: false

      - key: APP_URL
        value: https://ti-vagas.lucianorocha.dev.br

      - key: DB_CONNECTION
        value: pgsql

      - key: DB_URL
        sync: false

      - key: DB_SSLMODE
        value: require

      - key: QUEUE_CONNECTION
        value: database

      - key: DB_QUEUE
        value: vacancies

      - key: DB_QUEUE_RETRY_AFTER
        value: "150"

      - key: CACHE_STORE
        value: database
