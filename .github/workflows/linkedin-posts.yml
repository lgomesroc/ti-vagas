name: TI Vagas - LinkedIn Recruiter Posts

on:
  schedule:
    - cron: "0 6,10,14,18 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ti-vagas-linkedin-posts
  cancel-in-progress: false

jobs:
  collect-linkedin-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_CONNECTION: pgsql
      DB_URL: ${{ secrets.NEON_DATABASE_URL }}
      DB_SSLMODE: require
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LINKEDIN_POSTS_ENABLED: "true"
      LINKEDIN_POSTS_LOOKBACK_HOURS: "72"
      LINKEDIN_SECONDARY_ACCOUNT_ENABLED: ${{ secrets.LINKEDIN_SECONDARY_ACCOUNT_PROFILE_B64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, curl, zip, pcntl
          coverage: none

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependências Node
        run: npm ci --ignore-scripts

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Restaurar sessão da conta secundária
        if: ${{ env.LINKEDIN_SECONDARY_ACCOUNT_ENABLED == 'true' }}
        env:
          LINKEDIN_PROFILE_ARCHIVE: ${{ secrets.LINKEDIN_SECONDARY_ACCOUNT_PROFILE_B64 }}
        run: |
          mkdir -p .local/linkedin-secondary-profile
          printf '%s' "$LINKEDIN_PROFILE_ARCHIVE" | base64 --decode | tar -xz -C .local/linkedin-secondary-profile
          chmod -R go-rwx .local/linkedin-secondary-profile

      - name: Aplicar migrações pendentes
        run: php artisan migrate --force

      - name: Coletar, validar e cadastrar publicações
        run: php artisan linkedin:collect-posts
