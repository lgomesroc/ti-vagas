name: TI Vagas - LinkedIn Conta Secundária

on:
  schedule:
    - cron: "0 6,18 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ti-vagas-linkedin-secondary
  cancel-in-progress: false

jobs:
  search-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${{ secrets.APP_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      DB_CONNECTION: pgsql
      DB_SSLMODE: require
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LINKEDIN_HEADLESS: "true"
      LINKEDIN_POSTS_ENABLED: "true"
      LINKEDIN_POSTS_LOOKBACK_HOURS: "72"
      LINKEDIN_SECONDARY_ACCOUNT_ENABLED: "true"
      LINKEDIN_STORAGE_STATE_PATH: .local/linkedin-storage-state.json

    steps:
      - name: Resolver banco atualmente ativo no Render
        shell: bash
        run: |
          set -euo pipefail

          for name in APP_KEY RENDER_API_KEY RENDER_SERVICE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::A variável/secret $name não está configurada."
              exit 1
            fi
          done

          response="$(curl --fail --silent --show-error --retry 3 \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars?limit=100" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json")"

          active_url="$(jq -r '[.[] | select(.envVar.key == "DB_URL") | .envVar.value] | first // empty' <<< "$response")"

          if [ -z "$active_url" ]; then
            echo "::error::Não foi possível obter DB_URL das variáveis de ambiente do serviço Render."
            exit 1
          fi

          echo "::add-mask::$active_url"
          echo "DB_URL=$active_url" >> "$GITHUB_ENV"
          echo "Banco ativo do Render resolvido para a automação LinkedIn."
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: developer

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, curl, zip, pcntl
          coverage: none

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependências Node
        run: npm ci --ignore-scripts

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Restaurar sessão do LinkedIn
        env:
          LINKEDIN_STORAGE_STATE_B64: ${{ secrets.LINKEDIN_STORAGE_STATE_B64 }}
        run: |
          test -n "$LINKEDIN_STORAGE_STATE_B64" || {
            echo "::error::Secret LINKEDIN_STORAGE_STATE_B64 não configurada."
            exit 1
          }
          mkdir -p .local
          printf '%s' "$LINKEDIN_STORAGE_STATE_B64" | base64 --decode > "$LINKEDIN_STORAGE_STATE_PATH"
          chmod 600 "$LINKEDIN_STORAGE_STATE_PATH"

      - name: Aplicar migrações
        run: php artisan migrate --force

      - name: Pesquisar, filtrar e cadastrar publicações
        run: php artisan linkedin:collect-posts --mode=bot
