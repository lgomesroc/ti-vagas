name: Testes temporários - branch de empresas

on:
  push:
    branches:
      - feature/add-third-20-companies
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP - sintaxe e testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código da branch
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, curl, zip
          coverage: none

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verificar sintaxe de todos os arquivos PHP
        continue-on-error: true
        run: |
          find app bootstrap config database routes tests -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Executar suíte completa de testes
        run: php artisan test --compact
