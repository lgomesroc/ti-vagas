name: TI Vagas - Coleta global Gupy

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ti-vagas-gupy-global
  cancel-in-progress: false

jobs:
  gupy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: \${{ secrets.APP_KEY }}
      DB_CONNECTION: pgsql
      DB_URL: \${{ secrets.NEON_DATABASE_URL }}
      DB_SSLMODE: require
      QUEUE_CONNECTION: database
      DB_QUEUE: vacancies
      DB_QUEUE_RETRY_AFTER: "150"
      CACHE_STORE: database

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, curl, zip, pcntl
          coverage: none
      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Coletar e importar Gupy global
        run: php artisan vacancies:collect-gupy
