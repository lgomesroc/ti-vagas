name: TI Vagas - Coleta isolada Abler

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ti-vagas-database-operations
  cancel-in-progress: false

jobs:
  abler:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_CONNECTION: pgsql
      DB_URL: ${{ secrets.NEON_DATABASE_URL }}
      DB_SSLMODE: require
    steps:
      - name: Checkout developer
        uses: actions/checkout@v4
        with:
          ref: developer
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, curl, zip
          coverage: none
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Instalar dependências Node
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Coletar somente Abler
        run: php artisan vacancies:collect-source abler-global
