
name: TI Vagas - Automação

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "0 3 * * 1"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ti-vagas-vacancies
  cancel-in-progress: false

jobs:
  vacancies:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: developer

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, curl, zip
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Executar agendamentos Laravel
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: pgsql
          DB_URL: ${{ secrets.NEON_DATABASE_URL }}
          DB_SSLMODE: require
        run: php artisan schedule:run
