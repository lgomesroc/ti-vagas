
name: TI Vagas - CI

on:
  push:
    branches:
      - developer
      - main

  pull_request:
    branches:
      - developer
      - main

permissions:
  contents: read

jobs:
  php:
    name: Validar PHP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, curl, zip
          coverage: none

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verificar sintaxe PHP
        run: |
          find app bootstrap config database routes -type f -name "*.php" -print0 | xargs -0 -n1 php -l

  frontend:
    name: Compilar frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Compilar frontend
        run: npm run build
