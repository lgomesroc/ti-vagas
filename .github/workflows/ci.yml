name: TI Vagas - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php:
    name: Validar PHP e suíte completa
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ti_vagas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ti_vagas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ti_vagas_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, curl, zip
          coverage: none

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Garantir que o agendador não inicia coleta LinkedIn
        shell: bash
        run: |
          if php artisan schedule:list | grep -Eiq 'linkedin:(collect-posts|collect-secondary|collect-jobs)'; then
            echo "::error::O agendador ainda contém uma coleta automática do LinkedIn."
            exit 1
          fi

      - name: Verificar sintaxe de todos os arquivos PHP
        run: |
          find app bootstrap config database routes tests -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Executar suíte PHP completa (inclui LinkedIn offline)
        run: php artisan test --compact --display-warnings --testsuite=CI

  frontend:
    name: Testar Node e compilar frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - name: Verificar sintaxe dos coletores LinkedIn
        run: |
          node --check scripts/linkedin/jobs.mjs
          node --check scripts/linkedin/secondary-account.mjs
          node --check scripts/linkedin/runtime.mjs
          node --check scripts/linkedin/restore-session.mjs
          node --check scripts/linkedin/export-session.mjs

      - name: Executar testes Node offline (inclui E2E com servidor HTTP local)
        run: npm run test:linkedin

      - name: Compilar frontend
        run: npm run build
