name: Database failover - Neon <-> Prisma

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Serialize database copies, failover, and vacancy collection.
concurrency:
  group: ti-vagas-database-operations
  cancel-in-progress: false

jobs:
  failover:
    runs-on: ubuntu-latest
    container:
      image: postgres:18
    timeout-minutes: 30
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PRISMA_DATABASE_URL: ${{ secrets.PRISMA_DATABASE_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      HEALTH_URL: https://ti-vagas.lucianorocha.dev.br/up

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in NEON_DATABASE_URL PRISMA_DATABASE_URL RENDER_API_KEY RENDER_SERVICE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub secret $name is not configured."
              exit 1
            fi
          done

      - name: Synchronize standby and fail over when needed
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json")

          # Render exposes a dedicated endpoint for reading one service variable.
          current_json="$(curl --fail --silent --show-error --retry 3 \
            "${api}/services/${RENDER_SERVICE_ID}/env-vars/DB_URL" "${auth[@]}")"
          # Use Render's documented list endpoint. It returns an array of
          # { envVar: { key, value }, cursor } objects for service-level vars.
          current_json="$(curl --fail --silent --show-error --retry 3 \
            "${api}/services/${RENDER_SERVICE_ID}/env-vars?limit=100" "${auth[@]}")"
          current_url="$(jq -r '[.[] | select(.envVar.key == "DB_URL") | .envVar.value] | first // empty' <<< "$current_json")"

          if [ -z "$current_url" ]; then
            echo "::error::DB_URL was not found among the service-level environment variables returned by Render. It may be configured through a linked environment group."
            exit 1
          fi

          if [ "$current_url" = "$NEON_DATABASE_URL" ]; then
            active="neon"
          elif [ "$current_url" = "$PRISMA_DATABASE_URL" ]; then
            active="prisma"
          else
            echo "::error::Render DB_URL does not match either configured database. No changes were made."
            exit 1
          fi

          neon_ok=false
          if psql "$NEON_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; then
            neon_ok=true
          fi

          if [ "$active" = "neon" ] && [ "$neon_ok" = "true" ]; then
            source_url="$NEON_DATABASE_URL"
            target_url="$PRISMA_DATABASE_URL"
            target_name="Prisma"
            switch_to=""
            echo "Neon is active and healthy. Refreshing the Prisma standby."
          elif [ "$active" = "neon" ] && [ "$neon_ok" = "false" ]; then
            if ! psql "$PRISMA_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; then
              echo "::error::Neon is unavailable and Prisma failed its connection test. No URL change was made."
              exit 1
            fi
            echo "Neon is unavailable. Activating the last synchronized Prisma copy."
            switch_to="$PRISMA_DATABASE_URL"
          elif [ "$active" = "prisma" ] && [ "$neon_ok" = "true" ]; then
            source_url="$PRISMA_DATABASE_URL"
            target_url="$NEON_DATABASE_URL"
            target_name="Neon"
            switch_to="$NEON_DATABASE_URL"
            echo "Neon recovered. Copying Prisma to Neon before switching traffic back."
          else
            echo "Neon remains unavailable. Prisma stays active."
            exit 0
          fi

          # The destination is always the inactive database. A single-transaction
          # restore prevents a failed restore from leaving a partially replaced database.
          if [ -n "${source_url:-}" ]; then
            dump_file="$(mktemp)"
            trap 'rm -f "$dump_file"' EXIT

            pg_dump "$source_url" --format=custom --no-owner --no-privileges --file="$dump_file"
            pg_restore --exit-on-error --single-transaction --clean --if-exists \
              --no-owner --no-privileges --dbname="$target_url" "$dump_file"

            if ! psql "$target_url" -X -v ON_ERROR_STOP=1 -Atqc \
              'SELECT 1 FROM public.migrations LIMIT 1' >/dev/null; then
              echo "::error::The restored database did not pass the migrations-table check."
              exit 1
            fi

            echo "$target_name synchronization completed."
          fi

          # This endpoint changes only DB_URL; unlike the collection endpoint,
          # it preserves every other service variable.
          if [ -n "$switch_to" ]; then
            curl --fail --silent --show-error --request PUT \
              "${api}/services/${RENDER_SERVICE_ID}/env-vars/DB_URL" \
              "${auth[@]}" -H "Content-Type: application/json" \
              --data "$(jq -cn --arg value "$switch_to" '{value:$value}')" >/dev/null

            deploy_json="$(curl --fail --silent --show-error --request POST \
              "${api}/services/${RENDER_SERVICE_ID}/deploys" \
              "${auth[@]}" -H "Content-Type: application/json" --data '{}')"
            deploy_id="$(jq -r '.id // empty' <<< "$deploy_json")"
            if [ -z "$deploy_id" ]; then
              echo "::error::Render did not return a deploy ID."
              exit 1
            fi

            echo "Waiting for the Render deployment."
            live=false
            for attempt in $(seq 1 40); do
              deploy_status="$(curl --fail --silent --show-error \
                "${api}/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
                "${auth[@]}" | jq -r '.status // empty')"
              case "$deploy_status" in
                live) live=true; break ;;
                build_failed|update_failed|canceled|pre_deploy_failed|deactivated)
                  echo "::error::Render deployment ended with status: $deploy_status"
                  exit 1
                  ;;
              esac
              sleep 15
            done

            if [ "$live" != "true" ]; then
              echo "::error::Render deployment did not reach Live within 10 minutes."
              exit 1
            fi

            for attempt in $(seq 1 10); do
              if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null 2>&1; then
                echo "Application health check passed."
                exit 0
              fi
              sleep 6
            done

            echo "::error::Render is Live, but the application health check failed."
            exit 1
          fi
